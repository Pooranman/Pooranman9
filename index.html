<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Video Splitter</title>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #00f260, #0575e6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #00f260; }
      to { text-shadow: 0 0 20px #00f260, 0 0 30px #0575e6; }
    }

    input[type="file"],
    input[type="number"] {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      margin: 10px 5px;
      cursor: pointer;
    }

    input[type="number"] {
      width: 100px;
    }

    #loader {
      width: 320px;
      margin: 20px auto;
      height: 32px;
      background: #111;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f260, #0575e6);
      text-align: center;
      line-height: 32px;
      color: #fff;
      font-weight: bold;
      transition: width 0.3s ease;
    }

    #status {
      margin-top: 10px;
      font-size: 1.1em;
      color: #ccc;
    }

    #output {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .chunk-preview {
      background: #222;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,255,255,0.2);
      width: 240px;
    }

    .chunk-preview video {
      width: 100%;
      border-radius: 8px;
    }

    .chunk-preview p {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }

    .chunk-preview a {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      background: linear-gradient(90deg, #92fe9d, #00c9ff);
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      body { padding: 20px; }
      #loader { width: 100%; }
      .chunk-preview { width: 100%; }
    }
  </style>
</head>
<body>
  <h1>Smart Video Splitter</h1>
  <input type="file" id="videoUpload" accept="video/*"><br>
  <input type="number" id="durationInput" placeholder="Seconds" min="1" value="900">
  <div id="loader"><div id="progressBar">0%</div></div>
  <p id="status">Please upload a video and set split duration.</p>
  <div id="output"></div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });

    const videoUpload = document.getElementById('videoUpload');
    const durationInput = document.getElementById('durationInput');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('status');
    const output = document.getElementById('output');

    const setLoading = (loading) => {
      videoUpload.disabled = loading;
      durationInput.disabled = loading;
    };

    const updateProgress = (ratio) => {
      const percent = Math.min(Math.round(ratio * 100), 100);
      progressBar.style.width = percent + '%';
      progressBar.textContent = percent + '%';
    };

    const showStatus = (message) => {
      statusText.textContent = message;
    };

    const isValidFile = (file) => {
      return file && /\.(mp4|mov|mkv|avi)$/i.test(file.name);
    };

    const isValidDuration = (duration) => {
      return !isNaN(duration) && duration > 0;
    };

    const generateChunkPreviews = async (duration) => {
      let i = 0;
      while (true) {
        const chunkName = `chunk${String(i).padStart(3, '0')}.mp4`;
        try {
          const data = ffmpeg.FS('readFile', chunkName);
          const blob = new Blob([data.buffer], { type: 'video/mp4' });
          const url = URL.createObjectURL(blob);
          const startTime = duration * i;
          const minutes = Math.floor(startTime / 60);
          const seconds = startTime % 60;

          const preview = document.createElement('div');
          preview.className = 'chunk-preview';

          const video = document.createElement('video');
          video.src = url;
          video.controls = true;

          const time = document.createElement('p');
          time.textContent = `Start Time: ${minutes}m ${seconds}s`;

          const link = document.createElement('a');
          link.href = url;
          link.download = chunkName;
          link.textContent = 'Download';

          preview.appendChild(video);
          preview.appendChild(time);
          preview.appendChild(link);
          output.appendChild(preview);

          i++;
        } catch {
          break;
        }
      }
      return i;
    };

    const splitVideo = async (file, duration) => {
      setLoading(true);
      updateProgress(0);
      output.innerHTML = '';
      showStatus('Initializing FFmpeg...');

      try {
        if (!ffmpeg.isLoaded()) {
          ffmpeg.setProgress(({ ratio }) => updateProgress(ratio));
          await ffmpeg.load();
        }

        showStatus(`Processing: ${file.name}`);
        await ffmpeg.FS('writeFile', file.name, await fetchFile(file));
        updateProgress(0.2);

        showStatus(`Splitting every ${duration} seconds...`);
        await ffmpeg.run(
          '-i', file.name,
          '-c', 'copy',
          '-map', '0',
          '-f', 'segment',
          '-segment_time', `${duration}`,
          `chunk%03d.mp4`
        );

        updateProgress(0.9);
        showStatus('Generating previews and download links...');
        const chunksCount = await generateChunkPreviews(duration);

        updateProgress(1);
        showStatus(`Done! ${chunksCount} part(s) created.`);
      } catch (err) {
        console.error(err);
        showStatus('Error processing video. Please try again.');
      } finally {
        setLoading(false);
      }
    };

    videoUpload.addEventListener('change', () => {
      const file = videoUpload.files[0];
      const duration = parseInt(durationInput.value, 10);

      if (!isValidFile(file)) {
        showStatus('Invalid file. Please upload a video (mp4, mov, mkv, avi).');
        return;
      }

      if (!isValidDuration(duration)) {
        showStatus('Invalid duration. Please enter a value greater than 0.');
        return;
      }

      splitVideo(file, duration);
    });
  </script>
</body>
</html>
