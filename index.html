<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
     
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Video Splitter</title>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #00f260, #0575e6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #00f260; }
      to { text-shadow: 0 0 20px #00f260, 0 0 30px #0575e6; }
    }

    input[type="file"],
    input[type="number"] {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      margin: 10px 5px;
      cursor: pointer;
    }

    input[type="number"] {
      width: 100px;
    }

    #loader {
      width: 320px;
      margin: 20px auto;
      height: 32px;
      background: #111;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f260, #0575e6);
      text-align: center;
      line-height: 32px;
      color: #fff;
      font-weight: bold;
      transition: width 0.3s ease;
    }

    #status {
      margin-top: 10px;
      font-size: 1.1em;
      color: #ccc;
    }

    #output a {
      display: inline-block;
      margin: 10px 5px;
      padding: 10px 16px;
      border-radius: 8px;
      background: linear-gradient(90deg, #92fe9d, #00c9ff);
      color: #000;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #output a:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0,255,255,0.3);
    }

    video {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
    }

    @media (max-width: 480px) {
      body { padding: 20px; }
      #loader { width: 100%; }
    }
  </style>
</head>
<body>
  <h1>Smart Video Splitter</h1>
  <input type="file" id="videoUpload" accept="video/*"><br>
  <input type="number" id="durationInput" placeholder="Seconds" min="1" value="900">
  <div id="loader"><div id="progressBar">0%</div></div>
  <p id="status">Please upload a video and set split duration.</p>
  <div id="output"></div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });
    const videoUpload = document.getElementById('videoUpload');
    const durationInput = document.getElementById('durationInput');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('status');
    const output = document.getElementById('output');

    const updateProgress = (p) => {
      const percent = Math.min(Math.round(p * 100), 100);
      progressBar.style.width = percent + '%';
      progressBar.textContent = percent + '%';
    };

    const setLoading = (loading) => {
      videoUpload.disabled = loading;
      durationInput.disabled = loading;
    };

    const getDurationFromFFmpegLogs = (logs) => {
      const match = logs.match(/Duration: (\d+):(\d+):(\d+\.\d+)/);
      if (!match) return 0;
      const [, hh, mm, ss] = match;
      return parseInt(hh) * 3600 + parseInt(mm) * 60 + parseFloat(ss);
    };

    videoUpload.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      const chunkDuration = parseInt(durationInput.value || '900');

      if (!file || !file.name.match(/\.(mp4|mov|mkv|avi)$/i)) {
        statusText.textContent = 'Please upload a valid video file (mp4, mov, mkv, avi).';
        return;
      }

      if (!chunkDuration || chunkDuration <= 0) {
        statusText.textContent = 'Enter a valid split time in seconds.';
        return;
      }

      setLoading(true);
      updateProgress(0);
      output.innerHTML = '';
      statusText.textContent = 'Initializing FFmpeg...';

      try {
        if (!ffmpeg.isLoaded()) {
          ffmpeg.setProgress(({ ratio }) => updateProgress(ratio));
          await ffmpeg.load();
        }

        const inputName = file.name;
        await ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        statusText.textContent = 'Probing video duration...';
        let metadataOutput = '';
        const originalLog = console.log;
        console.log = (msg) => { metadataOutput += msg + '\n'; };

        try {
          await ffmpeg.run('-i', inputName);
        } catch {}

        console.log = originalLog;

        const totalDuration = getDurationFromFFmpegLogs(metadataOutput);
        const totalParts = Math.ceil(totalDuration / chunkDuration);
        if (!totalDuration || totalParts === 0) {
          throw new Error('Unable to determine video duration.');
        }

        statusText.textContent = `Splitting video into ${totalParts} part(s)...`;

        for (let i = 0; i < totalParts; i++) {
          const start = i * chunkDuration;
          const outputName = `part_${i}.mp4`;

          await ffmpeg.run(
            '-ss', `${start}`,
            '-t', `${chunkDuration}`,
            '-i', inputName,
            '-c', 'copy',
            outputName
          );

          const data = ffmpeg.FS('readFile', outputName);
          const blob = new Blob([data.buffer], { type: 'video/mp4' });
          const url = URL.createObjectURL(blob);

          const link = document.createElement('a');
          link.href = url;
          link.download = outputName;
          link.textContent = `Download part ${i + 1}`;
          output.appendChild(link);

          const videoPreview = document.createElement('video');
          videoPreview.src = url;
          videoPreview.controls = true;
          videoPreview.title = `Start: ${start}s`;
          output.appendChild(videoPreview);

          updateProgress((i + 1) / totalParts);
        }

        statusText.textContent = `Done! ${totalParts} part(s) created.`;
      } catch (err) {
        console.error(err);
        statusText.textContent = 'Error: ' + err.message;
      } finally {
        setLoading(false);
      }
    });
  </script>
  <button><a href="smarteditor.html">Smart Video Editor</a> </button>
</body>
</html>
