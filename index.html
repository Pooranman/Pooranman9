<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Video Splitter</title>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #00f260, #0575e6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #00f260; }
      to { text-shadow: 0 0 20px #00f260, 0 0 30px #0575e6; }
    }

    input[type="file"],
    input[type="number"] {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      margin: 10px 5px;
      cursor: pointer;
    }

    input[type="number"] {
      width: 100px;
    }

    #loader {
      width: 320px;
      margin: 20px auto;
      height: 32px;
      background: #111;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f260, #0575e6);
      text-align: center;
      line-height: 32px;
      color: #fff;
      font-weight: bold;
      transition: width 0.3s ease;
    }

    #status {
      margin-top: 10px;
      font-size: 1.1em;
      color: #ccc;
    }

    #output a {
      display: inline-block;
      margin: 10px 5px;
      padding: 10px 16px;
      border-radius: 8px;
      background: linear-gradient(90deg, #92fe9d, #00c9ff);
      color: #000;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #output a:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0,255,255,0.3);
    }

    video {
      width: 240px;
      margin: 10px;
      border-radius: 10px;
      border: 2px solid #00f260;
    }

    @media (max-width: 480px) {
      body { padding: 20px; }
      #loader { width: 100%; }
      video { width: 100%; }
    }
  </style>
</head>
<body>
  <h1>Smart Video Splitter</h1>
  <input type="file" id="videoUpload" accept="video/*"><br>
  <input type="number" id="durationInput" placeholder="Seconds" min="1" value="900">
  <div id="loader"><div id="progressBar">0%</div></div>
  <p id="status">Please upload a video and set split duration.</p>
  <div id="output"></div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });

    const videoUpload = document.getElementById('videoUpload');
    const durationInput = document.getElementById('durationInput');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('status');
    const output = document.getElementById('output');

    const setLoading = (loading) => {
      videoUpload.disabled = loading;
      durationInput.disabled = loading;
    };

    const updateProgress = (p) => {
      const percent = Math.min(Math.round(p * 100), 100);
      progressBar.style.width = percent + '%';
      progressBar.textContent = percent + '%';
    };

    videoUpload.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      const duration = parseInt(durationInput.value || '900');

      if (!file || !file.name.match(/\.(mp4|mov|mkv|avi)$/i)) {
        statusText.textContent = 'Please upload a valid video file (mp4, mov, mkv, avi).';
        return;
      }

      if (!duration || duration <= 0) {
        statusText.textContent = 'Enter a valid split time in seconds.';
        return;
      }

      setLoading(true);
      updateProgress(0);
      output.innerHTML = '';
      statusText.textContent = 'Initializing FFmpeg...';

      try {
        if (!ffmpeg.isLoaded()) {
          ffmpeg.setProgress(({ ratio }) => updateProgress(ratio));
          await ffmpeg.load();
        }

        const inputName = 'inputVideo' + file.name.substring(file.name.lastIndexOf('.'));
        statusText.textContent = 'Processing: ' + file.name;
        await ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        statusText.textContent = `Splitting every ${duration} seconds...`;

        await ffmpeg.run(
          '-i', inputName,
          '-force_key_frames', `expr:gte(t,n_forced*${duration})`,
          '-reset_timestamps', '1',
          '-map', '0',
          '-f', 'segment',
          '-segment_time', `${duration}`,
          '-c:v', 'libx264',
          '-c:a', 'aac',
          'chunk%03d.mp4'
        );

        updateProgress(0.9);
        statusText.textContent = 'Generating previews and download links...';

        let i = 0;
        while (true) {
          const chunkName = `chunk${String(i).padStart(3, '0')}.mp4`;
          try {
            const data = ffmpeg.FS('readFile', chunkName);
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);

            const container = document.createElement('div');

            const video = document.createElement('video');
            video.src = url;
            video.controls = true;

            const link = document.createElement('a');
            link.href = url;
            link.download = chunkName;
            link.textContent = `Download ${chunkName}`;

            container.appendChild(video);
            container.appendChild(link);
            output.appendChild(container);

            i++;
          } catch {
            break;
          }
        }

        updateProgress(1);
        statusText.textContent = `Done! ${i} part(s) created.`;
      } catch (err) {
        console.error(err);
        statusText.textContent = 'Error processing video. Please try again with a different file.';
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
